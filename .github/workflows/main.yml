name: Build CallAI Debug APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project zip if needed
        run: |
          if [ -f "callai-nov-23-2026-11-39-18-pm.zip" ]; then
            unzip -o -q callai-nov-23-2026-11-39-18-pm.zip -d extracted_proj
            if [ -d "extracted_proj/app" ]; then
              cp -rn extracted_proj/* . || true
            else
              inner_dir=$(find extracted_proj -mindepth 1 -maxdepth 1 -type d | head -n 1)
              if [ -n "$inner_dir" ]; then
                cp -rn "$inner_dir"/* . || true
              fi
            fi
            rm -rf extracted_proj
          fi
          ls -la

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Build Debug APK
        run: |
          if [ -f "gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            gradle wrapper --no-daemon
            chmod +x gradlew
            ./gradlew assembleDebug
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: callai-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          
